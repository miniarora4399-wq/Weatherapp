<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="icon" href="image/cutecloud.jpg">
    <link rel="stylesheet" href="weather.css">
    <script defer src="weather.js"></script>
</head>
<body>
    <div class="card">
         <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button>🔍</button>
         </div>
         <div class="weather">
              <img src="image/weather.jpg" alt="weather" class="weathericon">
              <h1 class="temp">22°C</h1>
              <h2 class="city">New York</h2>
              <div class="details">
                <div class="col">
                    <img src="image/Humidity.jpg" alt="humidity">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="image/wind.jpg" alt="wind">
                    <div>
                        <p class="wind">15km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
            </div>
         </div>
    </div>
     
</body>
</html>
